<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">职得 WORTH logo</title>
  <desc id="desc">A clean navy and teal logo combining two connected circles with an upward arrow.</desc>
  <g transform="translate(28 28)">
    <rect width="204" height="204" rx="48" fill="#FFFFFF"/>
    <!-- three parties: student, enterprise, university -->
    <path d="M102 58 56 151 148 151z" fill="none" stroke="#165DFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="102" cy="58" r="19" fill="#165DFF"/>
    <circle cx="56" cy="151" r="19" fill="#165DFF"/>
    <circle cx="148" cy="151" r="19" fill="#165DFF"/>
  </g>
  <g fill="#165DFF">
    <text x="278" y="128" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="72" font-weight="700" letter-spacing="8">职得</text>
    <text x="284" y="180" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="13">WORTH</text>
  </g>
  <path d="M282 202h260" stroke="#165DFF" stroke-width="7" stroke-linecap="round"/>
  <text x="570" y="174" fill="#165DFF" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" letter-spacing="3">学生 · 企业 · 高校</text>
</svg>
